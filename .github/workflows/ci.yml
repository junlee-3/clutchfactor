name: ci

# Feature-branch pushes are covered by their PR run; filtering `push` to main
# stops every commit being checked twice under the same check names, which is
# what branch protection matches on.
on:
  push:
    branches: [main]
  pull_request:

# PR pushes supersede that PR's earlier runs. Main pushes get a per-commit
# group: a shared group would let GitHub evict queued runs (it keeps at most
# one pending run per group, cancel-in-progress or not), so per-SHA is what
# actually guarantees every main commit its own pass/fail verdict — the
# signal ADR-0005 exists to protect. (CI gates fmt/clippy -D warnings, the
# workspace + frontend suites and the Windows build; golden-demo regression
# tests need fixtures/ demos and run locally, not here.)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # demoparser's csgoproto crate builds protos via prost-build, which needs protoc
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Windows breakage surfaces early, not at ship time (PROMPT.md §10.3).
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo build --workspace --locked
        working-directory: src-tauri

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:run
