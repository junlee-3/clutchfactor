[workspace]
members = ["crates/cf-parser", "crates/cf-analysis", "crates/cf-store", "crates/cf-narrator"]
resolver = "2"

[package]
name = "clutchfactor"
version = "1.0.0"
description = "ClutchFactor — CS2 coaching insights from demo files"
authors = ["junlee"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clutchfactor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Inlines the tracked player's Steam avatar as a data: URI (issue #39);
# already in the tree via reqwest, so this costs no extra build.
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# Already in the tree via Tauri; `sync` for the coach's per-match generation lock.
tokio = { version = "1", features = ["sync"] }
cf-analysis = { path = "crates/cf-analysis" }
cf-narrator = { path = "crates/cf-narrator" }
cf-parser = { path = "crates/cf-parser" }
cf-store = { path = "crates/cf-store" }

[dev-dependencies]
# The runtime the ignored live Steam test needs; the app itself only uses
# tokio::sync, so this stays out of the shipped binary.
tokio = { version = "1", features = ["macros", "rt"] }

