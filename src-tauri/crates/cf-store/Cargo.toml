[package]
name = "cf-store"
version = "0.1.0"
edition = "2021"

[dependencies]
cf-analysis = { path = "../cf-analysis" }
cf-parser = { path = "../cf-parser" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
